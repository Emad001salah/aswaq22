    <script>
      // Self-healing script: Clear stale Service Worker cache if a legacy JS error occurs
      window.addEventListener('error', function(e) {
        try {
          fetch('/api/log-client-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: e.message || 'Global Error',
              stack: e.error && e.error.stack || '',
              url: window.location.href,
              userAgent: navigator.userAgent
            })
          }).catch(function() {});
        } catch (_) {}

        if (e.message && (e.message.indexOf('before initialization') !== -1 || e.message.indexOf('Loading chunk') !== -1)) {
          console.warn('[Aswaq Auto-Recovery] Legacy cached JS error detected. Purging cache storage...');
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (let name of names) { caches.delete(name); }
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (let registration of registrations) { registration.unregister(); }
            });
          }
          setTimeout(function() { window.location.reload(true); }, 300);
        }
      });

      window.addEventListener('unhandledrejection', function(e) {
        try {
          fetch('/api/log-client-error', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: e.reason && e.reason.message || String(e.reason),
              stack: e.reason && e.reason.stack || '',
              url: window.location.href,
              userAgent: navigator.userAgent
            })
          }).catch(function() {});
        } catch (_) {}
      });

      // Audit DOM rendering and send to server to verify mounted state
      window.addEventListener('load', function() {
        setTimeout(function() {
          try {
            var root = document.getElementById('root');
            var rootHtml = root ? root.innerHTML : 'No root element!';
            fetch('/api/log-client-error', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                message: '[DOM Audit] root innerHTML size: ' + rootHtml.length,
                stack: rootHtml.substring(0, 1500),
                url: window.location.href,
                userAgent: navigator.userAgent
              })
            }).catch(function() {});
          } catch (_) {}
        }, 3000);
      });
    </script>
